{% extends "base.html" %}
{% block title %}Owner Login – Mandi 1{% endblock %}
{% block content %}
<section class="section container" style="max-width:420px;">
  <h2 class="section-title">🔑 Owner Login</h2>
  <p class="section-sub">For the restaurant owner only.</p>
  <div style="background:#fff;padding:26px;border-radius:14px;box-shadow:var(--shadow);border:2px solid var(--orange);">
    <form method="post">
      {% csrf_token %}
      <label>Username</label>
      {{ form.username }}
      <label>Password</label>
      {{ form.password }}
      {% if form.errors %}<div class="alert alert-danger">Incorrect username or password.</div>{% endif %}
      <button type="submit" class="btn btn-block">Log In as Owner</button>
    </form>
  </div>
</section>
{% endblock %}
